<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Vertex Backoffice</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <span data-module-title="Dashboard" style="display:none"></span>
    <script src="bo-shell.js"></script>
</head>
<body>

<main class="bo-page bo-animate">

    <div class="bo-page-header">
        <div>
            <div class="bo-eyebrow">Vue d'ensemble</div>
            <h1 class="bo-page-title">Dashboard</h1>
        </div>
        <div id="last-update" style="font-size:0.65rem;color:var(--muted);"></div>
    </div>

    <!-- Alert banner (hidden by default) -->
    <div id="alert-banner" class="bo-alert-banner" style="display:none; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);">
        <i data-lucide="alert-triangle" style="width:18px;height:18px;color:#ef4444;flex-shrink:0;"></i>
        <div>
            <div id="alert-title" style="font-size:0.75rem;font-weight:900;text-transform:uppercase;color:#f87171;margin-bottom:0.15rem;"></div>
            <div style="font-size:0.7rem;color:#94a3b8;">Vérifiez les modules concernés pour traiter les urgences.</div>
        </div>
    </div>

    <!-- KPI row -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;" id="kpi-grid">
        <!-- Injected by JS -->
    </div>

    <!-- Content grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">

        <!-- Recent interventions -->
        <div class="bo-card bo-card-p">
            <div style="font-size:0.6rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
                Interventions récentes
                <a href="bo-interventions.html" style="color:var(--gold);font-size:0.55rem;text-decoration:none;font-weight:800;letter-spacing:0.15em;">Tout voir →</a>
            </div>
            <div id="recent-list"></div>
        </div>

        <!-- Stock overview -->
        <div class="bo-card bo-card-p">
            <div style="font-size:0.6rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
                État des stocks
                <a href="bo-stock.html" style="color:var(--gold);font-size:0.55rem;text-decoration:none;font-weight:800;letter-spacing:0.15em;">Tout voir →</a>
            </div>
            <div id="stock-overview"></div>
        </div>

        <!-- Clients recap -->
        <div class="bo-card bo-card-p" style="grid-column:1/-1;">
            <div style="font-size:0.6rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
                Top clients (activité interventions)
                <a href="bo-clients.html" style="color:var(--gold);font-size:0.55rem;text-decoration:none;font-weight:800;letter-spacing:0.15em;">Gérer →</a>
            </div>
            <div id="clients-recap" style="display:flex;gap:1rem;flex-wrap:wrap;"></div>
        </div>

    </div>
</main>

<script>
const STATUS_C = {
    'Ouvert':   { bg:'rgba(59,130,246,0.15)',  border:'#3b82f6',  text:'#93c5fd' },
    'En cours': { bg:'rgba(245,158,11,0.15)',  border:'#f59e0b',  text:'#fcd34d' },
    'Résolu':   { bg:'rgba(16,185,129,0.15)',  border:'#10b981',  text:'#6ee7b7' },
    'Annulé':   { bg:'rgba(100,116,139,0.15)', border:'#64748b',  text:'#94a3b8' },
};
const PRIO_DOT = { 'Haute':'#ef4444', 'Moyenne':'#f59e0b', 'Basse':'#10b981' };

async function loadDashboard() {
    const [interventions, clients, stocks] = await Promise.all([
        BO.read(BO.KEYS.interventions, []),
        BO.read(BO.KEYS.clients, []),
        BO.read(BO.KEYS.stocks, []),
    ]);

    const open     = interventions.filter(i => i.statut === 'Ouvert').length;
    const inProg   = interventions.filter(i => i.statut === 'En cours').length;
    const resolved = interventions.filter(i => i.statut === 'Résolu').length;
    const urgent   = interventions.filter(i => i.priorite === 'Haute' && i.statut !== 'Résolu').length;
    const lowStock = stocks.filter(s => s.quantite <= s.seuilAlerte).length;
    const totalVal = stocks.reduce((a, s) => a + (s.quantite * s.prix), 0);

    // Alert banner
    if (urgent > 0 || lowStock > 0) {
        const banner = document.getElementById('alert-banner');
        const parts = [];
        if (urgent > 0) parts.push(`${urgent} intervention${urgent>1?'s':''} urgente${urgent>1?'s':''}`);
        if (lowStock > 0) parts.push(`${lowStock} article${lowStock>1?'s':''} en alerte stock`);
        document.getElementById('alert-title').textContent = parts.join(' · ');
        banner.style.display = 'flex';
        lucide.createIcons();
    }

    // KPIs
    const kpis = [
        { label:'Tickets ouverts',  val: open,     sub:'en attente',    color:'#3b82f6', icon:'inbox' },
        { label:'En cours',         val: inProg,   sub:'en traitement', color:'#f59e0b', icon:'clock' },
        { label:'Résolus',          val: resolved, sub:'ce mois',       color:'#10b981', icon:'check-circle' },
        { label:'Clients actifs',   val: clients.length, sub:'comptes', color:'#FFD700', icon:'users' },
        { label:'Alertes stock',    val: lowStock, sub:'sous le seuil', color:'#ef4444', icon:'alert-triangle' },
        { label:'Valeur inventaire',val: `${Math.round(totalVal/1000)}k €`, sub:'valorisation', color:'#8b5cf6', icon:'package' },
    ];

    document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
        <div class="bo-stat" style="border-color:${k.val > 0 && (k.label.includes('Alertes') || k.label.includes('urgent')) ? 'rgba(239,68,68,0.25)' : 'var(--border)'};">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem;">
                <div class="bo-stat-label">${k.label}</div>
                <div style="color:${k.color};"><i data-lucide="${k.icon}" style="width:16px;height:16px;"></i></div>
            </div>
            <div class="bo-stat-value" style="color:${k.color};">${k.val}</div>
            <div class="bo-stat-sub">${k.sub}</div>
        </div>
    `).join('');

    // Recent interventions
    const recent = [...interventions].sort((a,b) => b.dateCreation.localeCompare(a.dateCreation)).slice(0, 6);
    document.getElementById('recent-list').innerHTML = recent.length === 0
        ? `<div class="bo-empty"><div class="bo-empty-title">Aucune intervention</div></div>`
        : recent.map(i => {
            const c = clients.find(cl => cl.id === i.clientId);
            const st = STATUS_C[i.statut] || STATUS_C['Ouvert'];
            const overdue = i.dateEcheance && new Date(i.dateEcheance) < new Date() && i.statut !== 'Résolu';
            return `
            <div style="display:flex;align-items:center;gap:0.875rem;padding:0.75rem 0;border-bottom:1px solid var(--border);">
                <div style="width:8px;height:8px;border-radius:50%;background:${PRIO_DOT[i.priorite]||'#64748b'};flex-shrink:0;"></div>
                <div style="flex:1;min-width:0;">
                    <div style="font-size:0.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.titre}</div>
                    <div style="font-size:0.65rem;color:var(--muted);margin-top:0.1rem;">${c?.nom||'—'} · ${i.technicien||'Non assigné'}</div>
                    ${overdue ? `<div style="font-size:0.6rem;color:#f87171;margin-top:0.1rem;">⏰ Échéance dépassée</div>` : ''}
                </div>
                <span class="bo-badge" style="background:${st.bg};color:${st.text};border:1px solid ${st.border}44;">${i.statut}</span>
            </div>`;
        }).join('');

    // Stock overview
    document.getElementById('stock-overview').innerHTML = stocks.map(s => {
        const alert = s.quantite <= s.seuilAlerte;
        const warn  = s.quantite <= s.seuilAlerte * 1.5;
        const color = alert ? '#ef4444' : warn ? '#f59e0b' : '#10b981';
        const pct   = Math.min(100, (s.quantite / Math.max(s.seuilAlerte * 3, 1)) * 100);
        return `
        <div style="margin-bottom:0.875rem;">
            <div style="display:flex;justify-content:space-between;font-size:0.7rem;margin-bottom:0.3rem;">
                <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">${s.nom}</span>
                <span style="font-weight:800;color:${color};flex-shrink:0;">${s.quantite}<span style="color:var(--muted);font-weight:500;"> u.</span></span>
            </div>
            <div class="bo-progress-track">
                <div class="bo-progress-bar" style="width:${pct}%;background:${color};"></div>
            </div>
        </div>`;
    }).join('');

    // Clients recap
    const clientActivity = clients.map(c => ({
        ...c,
        count: interventions.filter(i => i.clientId === c.id).length
    })).sort((a,b) => b.count - a.count).slice(0, 6);

    document.getElementById('clients-recap').innerHTML = clientActivity.map(c => `
        <div style="background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:1rem;padding:1rem 1.25rem;min-width:180px;flex:1;">
            <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;">
                <div class="bo-avatar" style="width:36px;height:36px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);font-size:0.75rem;color:var(--gold);">${c.nom.slice(0,2).toUpperCase()}</div>
                <div style="min-width:0;">
                    <div style="font-size:0.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.nom}</div>
                    <div style="font-size:0.6rem;color:var(--muted);">${c.contact||'—'}</div>
                </div>
            </div>
            <div style="font-size:1.25rem;font-weight:900;font-style:italic;color:var(--gold);">${c.count}</div>
            <div style="font-size:0.6rem;color:var(--muted);">intervention${c.count!==1?'s':''}</div>
        </div>
    `).join('');

    document.getElementById('last-update').textContent = `Mis à jour à ${new Date().toLocaleTimeString('fr-FR')}`;
    lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>

</body>
</html>
