<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock · Vertex Backoffice</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <span data-module-title="Stock" style="display:none"></span>
    <script src="bo-shell.js"></script>
    <style>
        .stock-card {
            background:var(--card); border:1px solid var(--border);
            border-radius:1.25rem; padding:1.25rem;
            transition:all 0.25s; position: relative;
        }
        .stock-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,0.3); }
        .stock-card.alert { border-color:rgba(239,68,68,0.5); background: rgba(239,68,68,0.02); }
        .stock-card.warn  { border-color:rgba(245,158,11,0.3); }

        /* ── EBP IMPORT MODAL ── */
        #ebp-modal .bo-modal { max-width:640px; }
        .ebp-drop-zone {
            border: 2px dashed rgba(255,215,0,0.3); border-radius: 1rem;
            padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
            transition: all 0.2s; background: rgba(255,215,0,0.03); position: relative;
        }
        .ebp-drop-zone:hover, .ebp-drop-zone.drag-over { border-color: rgba(255,215,0,0.7); background: rgba(255,215,0,0.07); }
        .ebp-drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width:100%; height:100%; }

        .ebp-step { display:none; }
        .ebp-step.active { display:block; }

        .ebp-stepper { display: flex; gap: 0.5rem; margin-bottom: 1.75rem; align-items: center; }
        .ebp-step-dot {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 900; border: 1px solid var(--border); color: var(--muted); flex-shrink: 0;
        }
        .ebp-step-dot.active { background: #FFD700; color: #000; border-color: #FFD700; }
        .ebp-step-line { flex:1; height:1px; background: var(--border); }

        .ebp-map-row { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 0.75rem; align-items: center; margin-bottom: 0.6rem; }
        .ebp-map-label { font-size: 0.7rem; font-weight: 700; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.45rem 0.75rem; }

        .ebp-preview-table { width: 100%; border-collapse: collapse; font-size: 0.65rem; }
        .ebp-preview-table th { background: rgba(255,215,0,0.07); color: #FFD700; padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
        .ebp-preview-table td { padding: 0.4rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--muted); }
        
        .ebp-badge-new { background:rgba(16,185,129,0.15); color:#6ee7b7; padding:0.15rem 0.5rem; border-radius:999px; font-size:0.6rem; }
        .ebp-badge-upd { background:rgba(245,158,11,0.15); color:#fcd34d; padding:0.15rem 0.5rem; border-radius:999px; font-size:0.6rem; }
    </style>
</head>
<body>

<main class="bo-page bo-animate">
    <div class="bo-page-header">
        <div>
            <div class="bo-eyebrow">Inventaire</div>
            <h1 class="bo-page-title">Stock</h1>
        </div>
        <div style="display:flex;gap:0.75rem;">
            <button class="bo-btn-ghost" onclick="openEbpImport()" style="display:flex;align-items:center;gap:0.5rem;font-size:0.7rem;">
                <i data-lucide="upload" style="width:14px;height:14px;"></i> Importer EBP
            </button>
            <button class="bo-btn-gold" onclick="openForm()">
                <i data-lucide="plus" style="width:14px;height:14px;"></i> Ajouter
            </button>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;" id="kpi-row"></div>

    <div id="alert-banner" style="display:none;" class="bo-alert-banner">
        <i data-lucide="alert-triangle" style="width:18px;height:18px;color:#ef4444;"></i>
        <div id="alert-items" style="font-size:0.7rem; color:var(--muted);"></div>
    </div>

    <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;">
        <div class="bo-search-wrap" style="flex:1;min-width:180px;">
            <i data-lucide="search" class="bo-search-icon"></i>
            <input id="search" class="bo-search" placeholder="Réf, nom…" oninput="render()">
        </div>
        
        <select id="sort-select" class="bo-select" style="width:auto; font-size:0.7rem;" onchange="render()">
            <option value="nom">Trier par Nom</option>
            <option value="qty-asc">Stock : + Petit</option>
            <option value="qty-desc">Stock : + Grand</option>
            <option value="prix">Prix : + Élevé</option>
        </select>

        <div id="cat-pills" style="display:flex;gap:0.4rem;"></div>
        
        <div id="view-toggle" style="display:flex;gap:0.4rem;">
            <button class="bo-pill active" id="view-grid" onclick="setView('grid')"><i data-lucide="layout-grid"></i></button>
            <button class="bo-pill" id="view-list" onclick="setView('list')"><i data-lucide="list"></i></button>
        </div>
    </div>

    <div id="stock-container"></div>
</main>

<div class="bo-modal-overlay" id="modal" style="display:none;">
    <div class="bo-modal" style="max-width:520px;">
        <div class="bo-modal-header">
            <div class="bo-modal-title" id="modal-title">Article</div>
            <button class="bo-modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="bo-field"><label class="bo-label">Nom <span class="req">*</span></label><input id="f-nom" class="bo-input"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="bo-field"><label class="bo-label">Référence</label><input id="f-ref" class="bo-input"></div>
            <div class="bo-field">
                <label class="bo-label">Catégorie</label>
                <select id="f-cat" class="bo-select">
                    <option>Affichage</option><option>LED</option><option>Totem</option><option>Câblage</option><option>Autre</option>
                </select>
            </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
            <div class="bo-field"><label class="bo-label">Quantité</label><input id="f-qty" type="number" class="bo-input"></div>
            <div class="bo-field"><label class="bo-label">Seuil (0=off)</label><input id="f-seuil" type="number" class="bo-input"></div>
            <div class="bo-field"><label class="bo-label">Prix (€)</label><input id="f-prix" type="number" class="bo-input"></div>
        </div>
        <div class="bo-modal-footer">
            <button class="bo-btn-gold" onclick="saveForm()">Enregistrer</button>
        </div>
    </div>
</div>

<div class="bo-modal-overlay" id="ebp-modal" style="display:none;">
    <div class="bo-modal">
        <div class="bo-modal-header">
            <div class="bo-modal-title">Import EBP</div>
            <button class="bo-modal-close" onclick="closeEbpModal()"><i data-lucide="x"></i></button>
        </div>

        <div class="ebp-stepper">
            <div class="ebp-step-dot active" id="sd-1">1</div><div class="ebp-step-line"></div>
            <div class="ebp-step-dot" id="sd-2">2</div><div class="ebp-step-line"></div>
            <div class="ebp-step-dot" id="sd-3">3</div>
        </div>

        <div class="ebp-step active" id="ebp-s1">
            <div class="ebp-drop-zone" id="ebp-drop">
                <input type="file" accept=".csv,.txt,.xlsx" onchange="ebpFileSelected(this.files[0])">
                <i data-lucide="upload-cloud" style="width:40px;height:40px;color:#FFD700;margin-bottom:1rem;"></i>
                <div>Glissez votre fichier EBP ici</div>
            </div>
            <div id="ebp-file-info" style="display:none; margin-top:1rem; color:#6ee7b7; font-size:0.7rem;"></div>
            <div class="bo-modal-footer"><button class="bo-btn-gold" id="ebp-next1" disabled onclick="ebpGoStep2()">Suivant</button></div>
        </div>

        <div class="ebp-step" id="ebp-s2">
            <div id="ebp-map-container"></div>
            <div class="bo-modal-footer"><button class="bo-btn-gold" onclick="ebpGoStep3()">Prévisualiser</button></div>
        </div>

        <div class="ebp-step" id="ebp-s3">
            <div style="max-height:300px; overflow-y:auto; border:1px solid var(--border); border-radius:0.5rem;">
                <table class="ebp-preview-table"><tbody id="ebp-preview-body"></tbody></table>
            </div>
            <div class="bo-modal-footer"><button class="bo-btn-gold" onclick="ebpConfirmImport()">Importer</button></div>
        </div>
    </div>
</div>

<script>
let stocks = [];
let filterCat = 'Toutes';
let editId = null, viewMode = 'grid';
let ebpRawData = [], ebpHeaders = [], ebpFile = null;

async function init() {
    stocks = await BO.read(BO.KEYS.stocks, []);
    buildCatPills();
    render();
}

/** * CORRECTIONS ACCENTS & NETTOYAGE
 */
function cleanText(t) {
    if(!t) return "";
    return t.toString().trim().replace(/[^\x20-\x7E\xC0-\xFF]/g, '').replace(/\s+/g, ' ');
}

function buildCatPills() {
    const cats = ['Toutes', ...new Set(stocks.map(s => s.categorie))];
    document.getElementById('cat-pills').innerHTML = cats.map(c => `
        <button class="bo-pill ${c===filterCat?'active':''}" onclick="filterCat='${c}';buildCatPills();render();">${c}</button>
    `).join('');
}

function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const sortBy = document.getElementById('sort-select').value;

    let filtered = stocks.filter(s => {
        const mq = !q || s.nom.toLowerCase().includes(q) || (s.ref||'').toLowerCase().includes(q);
        return mq && (filterCat==='Toutes' || s.categorie===filterCat);
    });

    filtered.sort((a,b) => {
        if(sortBy==='qty-asc') return a.quantite - b.quantite;
        if(sortBy==='qty-desc') return b.quantite - a.quantite;
        if(sortBy==='prix') return (b.prix||0) - (a.prix||0);
        return a.nom.localeCompare(b.nom);
    });

    // Alertes
    const alerts = stocks.filter(s => s.seuilAlerte > 0 && s.quantite <= s.seuilAlerte);
    const banner = document.getElementById('alert-banner');
    if(alerts.length > 0) {
        banner.style.display = 'flex';
        document.getElementById('alert-items').textContent = alerts.slice(0,3).map(a => a.nom).join(', ') + (alerts.length>3?'...':'');
    } else banner.style.display = 'none';

    // KPIs
    const val = stocks.reduce((a,s) => a+(s.quantite*(s.prix||0)), 0);
    document.getElementById('kpi-row').innerHTML = `
        <div class="bo-stat"><div class="bo-stat-label">Valeur</div><div class="bo-stat-value">${Math.round(val).toLocaleString()}€</div></div>
        <div class="bo-stat"><div class="bo-stat-label">Alertes</div><div class="bo-stat-value" style="color:#ef4444">${alerts.length}</div></div>
    `;

    const cont = document.getElementById('stock-container');
    cont.style.display = viewMode === 'grid' ? 'grid' : 'block';
    cont.innerHTML = filtered.map(s => viewMode==='grid' ? renderCardGrid(s) : renderCardList(s)).join('');
    lucide.createIcons();
}

function renderCardGrid(s) {
    const color = (s.seuilAlerte>0 && s.quantite<=s.seuilAlerte) ? '#ef4444' : '#10b981';
    return `<div class="stock-card">
        <div style="font-size:0.6rem; color:var(--muted)">${s.ref||'-'}</div>
        <div style="font-weight:700; margin:0.5rem 0;">${s.nom}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:1.5rem; font-weight:900; color:${color}">${s.quantite}</div>
            <div style="display:flex; gap:0.4rem;">
                <button onclick="openForm('${s.id}')" class="bo-btn-icon"><i data-lucide="pencil"></i></button>
                <button onclick="deleteItem('${s.id}')" class="bo-btn-icon"><i data-lucide="trash-2" style="color:#ef4444"></i></button>
            </div>
        </div>
    </div>`;
}

function renderCardList(s) {
    return `<div class="bo-row">
        <div style="width:100px; font-size:0.7rem;">${s.ref||'-'}</div>
        <div style="flex:1"><strong>${s.nom}</strong></div>
        <div style="width:60px; font-weight:900;">${s.quantite}</div>
        <button onclick="openForm('${s.id}')" class="bo-btn-icon"><i data-lucide="pencil"></i></button>
    </div>`;
}

/* --- LOGIQUE IMPORT EBP AMÉLIORÉE --- */
function openEbpImport() { 
    ebpReset();
    document.getElementById('ebp-modal').style.display='flex'; 
    lucide.createIcons();
}

function ebpFileSelected(file) {
    if(!file) return;
    ebpFile = file;
    const reader = new FileReader();
    
    // Correction cruciale : ISO-8859-1 pour EBP Windows
    reader.readAsText(file, "ISO-8859-1"); 
    
    reader.onload = (e) => {
        const content = e.target.result;
        // On nettoie les lignes et on détecte le séparateur
        const lines = content.split(/\r?\n/).filter(l => l.trim() !== "");
        const sep = content.includes(';') ? ';' : ',';
        ebpHeaders = lines[0].split(sep).map(h => h.replace(/"/g, '').trim());
        ebpRawData = lines.slice(1).map(l => l.split(sep).map(v => v.replace(/"/g, '').trim()));
        
        document.getElementById('ebp-file-info').style.display = 'block';
        document.getElementById('ebp-file-info').textContent = `Fichier prêt : ${file.name} (${ebpRawData.length} lignes)`;
        document.getElementById('ebp-next1').disabled = false;
    };
}

function ebpGoStep2() {
    const fields = [
        { id: 'nom', label: 'Nom / Désignation', search: ['nom', 'designation', 'libelle'] },
        { id: 'ref', label: 'Référence', search: ['ref', 'code'] },
        { id: 'qty', label: 'Quantité Stock', search: ['stock', 'reelle', 'quantite'] },
        { id: 'prix', label: 'Prix Vente', search: ['prix', 'vente', 'ht'] }
    ];

    let html = '';
    fields.forEach(f => {
        const found = ebpHeaders.findIndex(h => f.search.some(s => h.toLowerCase().includes(s)));
        html += `<div class="ebp-map-row">
            <div class="ebp-map-label">${f.label}</div>
            <div style="text-align:center; color:#FFD700">→</div>
            <select id="map-${f.id}" class="bo-select">
                <option value="-1">Ne pas importer</option>
                ${ebpHeaders.map((h, i) => `<option value="${i}" ${i===found?'selected':''}>${h}</button>`).join('')}
            </select>
        </div>`;
    });

    document.getElementById('ebp-map-container').innerHTML = html;
    switchStep(2);
}

function ebpGoStep3() {
    const map = {
        nom: parseInt(document.getElementById('map-nom').value),
        ref: parseInt(document.getElementById('map-ref').value),
        qty: parseInt(document.getElementById('map-qty').value),
        prix: parseInt(document.getElementById('map-prix').value)
    };

    let html = '';
    ebpRawData.slice(0, 50).forEach(row => {
        const nom = cleanText(row[map.nom]);
        if(!nom) return;
        const exist = stocks.find(s => s.ref === row[map.ref]);
        html += `<tr>
            <td><span class="${exist?'ebp-badge-upd':'ebp-badge-new'}">${exist?'MAJ':'NEW'}</span></td>
            <td>${row[map.ref]||'-'}</td>
            <td>${nom}</td>
            <td>${row[map.qty]||0}</td>
        </tr>`;
    });
    document.getElementById('ebp-preview-body').innerHTML = html;
    switchStep(3);
}

async function ebpConfirmImport() {
    const map = {
        nom: parseInt(document.getElementById('map-nom').value),
        ref: parseInt(document.getElementById('map-ref').value),
        qty: parseInt(document.getElementById('map-qty').value),
        prix: parseInt(document.getElementById('map-prix').value)
    };

    ebpRawData.forEach(row => {
        const nom = cleanText(row[map.nom]);
        if(!nom) return;
        
        const ref = cleanText(row[map.ref]);
        const qty = parseInt(row[map.qty]) || 0;
        const prix = parseFloat(row[map.prix]?.replace(',', '.')) || 0;

        const idx = stocks.findIndex(s => s.ref === ref && ref !== "");
        if(idx !== -1) {
            stocks[idx].quantite = qty;
            stocks[idx].prix = prix;
            stocks[idx].nom = nom;
        } else {
            stocks.push({
                id: Date.now().toString() + Math.random(),
                nom, ref, quantite: qty, prix, 
                categorie: 'Autre', seuilAlerte: 0
            });
        }
    });

    await BO.write(BO.KEYS.stocks, stocks);
    closeEbpModal();
    render();
    alert("Importation terminée avec succès.");
}

/* UTILS */
function switchStep(n) {
    document.querySelectorAll('.ebp-step').forEach(s => s.classList.remove('active'));
    document.getElementById(`ebp-s${n}`).classList.add('active');
    document.querySelectorAll('.ebp-step-dot').forEach((d, i) => d.classList.toggle('active', i+1 === n));
}

function ebpReset() {
    ebpFile = null; ebpRawData = [];
    document.getElementById('ebp-file-info').style.display='none';
    document.getElementById('ebp-next1').disabled=true;
    switchStep(1);
}

function openForm(id=null) {
    editId = id; closeModal(); 
    document.getElementById('modal').style.display='flex';
    if(id) {
        const s = stocks.find(x => x.id === id);
        document.getElementById('f-nom').value = s.nom;
        document.getElementById('f-ref').value = s.ref;
        document.getElementById('f-qty').value = s.quantite;
        document.getElementById('f-seuil').value = s.seuilAlerte;
        document.getElementById('f-prix').value = s.prix;
    }
}

async function saveForm() {
    const item = {
        id: editId || Date.now().toString(),
        nom: cleanText(document.getElementById('f-nom').value),
        ref: cleanText(document.getElementById('f-ref').value),
        categorie: document.getElementById('f-cat').value,
        quantite: parseInt(document.getElementById('f-qty').value)||0,
        seuilAlerte: parseInt(document.getElementById('f-seuil').value)||0,
        prix: parseFloat(document.getElementById('f-prix').value)||0
    };
    if(editId) stocks = stocks.map(s => s.id === editId ? item : s);
    else stocks.push(item);
    await BO.write(BO.KEYS.stocks, stocks);
    closeModal(); render();
}

async function deleteItem(id) {
    if(confirm("Supprimer ?")) {
        stocks = stocks.filter(s => s.id !== id);
        await BO.write(BO.KEYS.stocks, stocks);
        render();
    }
}

function setView(m) { viewMode=m; render(); }
function closeModal() { document.getElementById('modal').style.display='none'; }
function closeEbpModal() { document.getElementById('ebp-modal').style.display='none'; }

init();
</script>
</body>
</html>
